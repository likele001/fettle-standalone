# ============================================================================
# Secret —— 敏感凭据
# ----------------------------------------------------------------------------
# ⚠️ 本文件里的值全部是占位符，直接 apply 会导致服务拒绝启动（这是有意的，
#    属于 fail-fast 设计）。部署前必须替换为真实值。
#
# 推荐做法（二选一）：
#
# 【方案 1 · 推荐】用 deploy/k8s/gen-secret.sh 从环境变量生成：
#     export DB_PASSWORD='...' JWT_SECRET='...' ...
#     ./gen-secret.sh | kubectl apply -f -
#
# 【方案 2】手工替换本文件中的 __REQUIRED__ 后 apply：
#     kubectl apply -f 01-secret.yaml
#
# 更严格的环境请改用外部密钥管理（Sealed Secrets / External Secrets /
# Vault Agent Injector），不要把手写明文 Secret 提交到 Git。
#
# 生成随机值的命令：
#     openssl rand -hex 32      # 64 位十六进制
#     openssl rand -base64 32   # 强随机 base64
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: fettle-secret
  namespace: fettle
  labels:
    app.kubernetes.io/name: fettle
    app.kubernetes.io/part-of: fettle
type: Opaque
stringData:
  # ---- 必填：缺失会导致对应服务启动即退出 ----
  # 数据库口令（postgres / 全部后端服务共用）
  DB_PASSWORD: "__REQUIRED__"
  # 网关与各服务签发/校验 JWT 用，必须全局一致
  JWT_SECRET: "__REQUIRED__"
  # ai-engine 内部调用令牌（gateway → ai-engine）
  AI_ENGINE_INTERNAL_TOKEN: "__REQUIRED__"
  # billing-service 内部调用令牌
  BILLING_INTERNAL_TOKEN: "__REQUIRED__"

  # ---- 按需：启用了对应中间件才需要填 ----
  # Redis 未设密码时留空字符串（不是删除该键）
  REDIS_PASSWORD: ""
  # MinIO / 对象存储；未启用 MINIO_ENDPOINT 时留空
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  # MongoDB（chat-service 会话存储）
  MONGODB_PASSWORD: ""
  # NATS 未启用认证时留空
  NATS_PASSWORD: ""
  # 渠道插件共用的回调签名密钥（5 个 plugin 都会读）
  CHANNEL_SECRET: ""
