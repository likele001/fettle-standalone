apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: fettle
  labels:
    app: chat-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: fettle/chat-service:latest
        ports:
        - containerPort: 20019
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: fettle
spec:
  selector:
    app: chat-service
  ports:
  - port: 20019
    targetPort: 20019
  type: ClusterIP
