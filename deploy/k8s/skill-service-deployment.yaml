apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-service
  namespace: fettle
  labels:
    app: skill-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skill-service
  template:
    metadata:
      labels:
        app: skill-service
    spec:
      containers:
      - name: skill-service
        image: fettle/skill-service:latest
        ports:
        - containerPort: 9105
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: skill-service
  namespace: fettle
spec:
  selector:
    app: skill-service
  ports:
  - port: 9105
    targetPort: 9105
  type: ClusterIP
