# ============================================================================
# PodDisruptionBudget —— 保障滚动/驱逐期间可用性
# ----------------------------------------------------------------------------
# 只给多副本的关键服务配；中间件是单副本，配了会阻塞节点维护。
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: fettle
  labels:
    app: gateway
    app.kubernetes.io/part-of: fettle
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service-pdb
  namespace: fettle
  labels:
    app: user-service
    app.kubernetes.io/part-of: fettle
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-engine-pdb
  namespace: fettle
  labels:
    app: ai-engine
    app.kubernetes.io/part-of: fettle
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-engine
