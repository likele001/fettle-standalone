apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: fettle
  labels:
    app: ai-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
      - name: ai-engine
        image: fettle/ai-engine:latest
        ports:
        - containerPort: 9106
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: fettle
spec:
  selector:
    app: ai-engine
  ports:
  - port: 9106
    targetPort: 9106
  type: ClusterIP
