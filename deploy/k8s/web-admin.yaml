apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-admin
  template:
    metadata:
      labels:
        app: web-admin
    spec:
      containers:
        - name: web-admin
          image: ai-platform/web-admin:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-admin
  namespace: ai-platform
spec:
  type: NodePort
  selector:
    app: web-admin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30200
