apiVersion: apps/v1
kind: Deployment
metadata:
  name: dingtalk-plugin
  namespace: fettle
  labels:
    app: dingtalk-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dingtalk-plugin
  template:
    metadata:
      labels:
        app: dingtalk-plugin
    spec:
      containers:
      - name: dingtalk-plugin
        image: fettle/dingtalk-plugin:latest
        ports:
        - containerPort: 9004
        env:
        - name: NATS_ADDR
          value: "nats:4222"
        - name: GATEWAY_ADDR
          value: "gateway:20001"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dingtalk-plugin
  namespace: fettle
spec:
  selector:
    app: dingtalk-plugin
  ports:
  - port: 9004
    targetPort: 9004
  type: ClusterIP