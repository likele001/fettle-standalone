apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-config
  namespace: ai-platform
data:
  # 应用端口（统一落在 20001-9900）
  GATEWAY_PORT: "20001"
  USER_SERVICE_PORT: "20002"
  WEB_ADMIN_PORT: "20009"

  # 数据库
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "ai_platform"
  DB_NAME: "ai_platform"

  # Redis
  REDIS_ADDR: "redis:6379"

  # 服务地址
  USER_SERVICE_ADDR: "http://user-service:20002"
