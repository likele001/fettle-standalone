apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fettle
  labels:
    app: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: fettle/gateway:latest
        ports:
        - containerPort: 20001
        env:
        - name: CONFIG_PATH
          value: /app/config.yaml
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 20001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 20001
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fettle
spec:
  selector:
    app: gateway
  ports:
  - port: 20001
    targetPort: 20001
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: fettle
data:
  config.yaml: |
    server:
      port: 20001
      mode: release
    jwt:
      secret: "your-jwt-secret-key"
      expire_hours: 72
    database:
      host: postgres
      port: 5432
      user: postgres
      password: your-password
      dbname: fettle_gateway
      sslmode: disable
    redis:
      host: redis
      port: 6379
    services:
      user_service: "http://user-service:20015"
      agent_service: "http://agent-service:20016"
      chat_service: "http://chat-service:20019"
      billing_service: "http://billing-service:20020"
      skill_service: "http://skill-service:9105"
      ai_engine: "http://ai-engine:9106"
