# ============================================================================
# MinIO —— S3 兼容对象存储（文件上传 / 向量库后端）
# ----------------------------------------------------------------------------
# ⚠️ 绝不要使用出厂默认凭据 minioadmin / minioadmin。
#    01-secret.yaml 的 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 为空时本服务
#    会因 minio 拒绝空凭据而启动失败 —— 这是有意的 fail-fast。
#    生成凭据：openssl rand -hex 16
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fettle
  labels:
    app: minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: fettle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: MINIO_SECRET_KEY
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: fettle
  labels:
    app: minio
    app.kubernetes.io/part-of: fettle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fettle
  labels:
    app: minio
    app.kubernetes.io/part-of: fettle
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# 一次性 Job：创建业务 bucket。MinIO 无自动建桶能力。
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: fettle
  labels:
    app: minio
    app.kubernetes.io/part-of: fettle
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 \
                    "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing local/fettle
              mc anonymous set download local/fettle/public || true
              echo "bucket ready"
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: MINIO_SECRET_KEY
