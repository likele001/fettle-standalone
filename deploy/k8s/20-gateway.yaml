# ============================================================================
# gateway —— API 网关（对外唯一入口）
# ----------------------------------------------------------------------------
# 端口 20001，与 docker-compose.yml 的 GATEWAY_PORT 一致。
# 依赖：postgres / redis
# JWT_SECRET 缺失时 gateway 会 logger.Fatal 退出（见 backend/gateway/main.go）。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fettle
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: fettle
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: fettle/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 20001
          env:
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: GATEWAY_PORT
            - name: GIN_MODE
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: GIN_MODE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: LOG_LEVEL
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: ALLOWED_ORIGINS
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_NAME
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: REDIS_ADDR
            - name: USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: USER_SERVICE_ADDR
            - name: AGENT_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: AGENT_SERVICE_ADDR
            - name: CHAT_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: CHAT_SERVICE_ADDR
            - name: SKILL_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: SKILL_SERVICE_ADDR
            - name: BILLING_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: BILLING_SERVICE_ADDR
            - name: AI_ENGINE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: AI_ENGINE_ADDR
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: JWT_SECRET
            - name: AI_ENGINE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: AI_ENGINE_INTERNAL_TOKEN
            - name: BILLING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: BILLING_INTERNAL_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 20001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 20001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fettle
  labels:
    app: gateway
    app.kubernetes.io/part-of: fettle
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 20001
      targetPort: 20001
