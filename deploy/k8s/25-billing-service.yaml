# ============================================================================
# billing-service —— 计费 / 用量服务
# ----------------------------------------------------------------------------
# 端口 20006，与 docker-compose.yml 的 BILLING_SERVICE_PORT 一致。
# 对外暴露内部调用令牌 BILLING_INTERNAL_TOKEN（gateway 调用时校验）。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: fettle
  labels:
    app: billing-service
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: fettle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-service
          image: fettle/billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 20006
          env:
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: BILLING_SERVICE_PORT
            - name: GIN_MODE
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: GIN_MODE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: LOG_LEVEL
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: ALLOWED_ORIGINS
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: DB_NAME
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fettle-config
                  key: REDIS_ADDR
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: JWT_SECRET
            - name: BILLING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: BILLING_INTERNAL_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 20006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 20006
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: fettle
  labels:
    app: billing-service
    app.kubernetes.io/part-of: fettle
spec:
  type: ClusterIP
  selector:
    app: billing-service
  ports:
    - name: http
      port: 20006
      targetPort: 20006
