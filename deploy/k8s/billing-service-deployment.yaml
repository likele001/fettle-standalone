apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: fettle
  labels:
    app: billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
      - name: billing-service
        image: fettle/billing-service:latest
        ports:
        - containerPort: 20020
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: fettle
spec:
  selector:
    app: billing-service
  ports:
  - port: 20020
    targetPort: 20020
  type: ClusterIP
