apiVersion: apps/v1
kind: Deployment
metadata:
  name: wechat-plugin
  namespace: fettle
  labels:
    app: wechat-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wechat-plugin
  template:
    metadata:
      labels:
        app: wechat-plugin
    spec:
      containers:
      - name: wechat-plugin
        image: fettle/wechat-plugin:latest
        ports:
        - containerPort: 9001
        env:
        - name: NATS_ADDR
          value: "nats:4222"
        - name: GATEWAY_ADDR
          value: "gateway:20001"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wechat-plugin
  namespace: fettle
spec:
  selector:
    app: wechat-plugin
  ports:
  - port: 9001
    targetPort: 9001
  type: ClusterIP