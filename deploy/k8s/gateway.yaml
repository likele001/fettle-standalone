apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ai-platform/gateway:latest
          ports:
            - containerPort: 20001
          env:
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: GATEWAY_PORT
            - name: USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: USER_SERVICE_ADDR
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: REDIS_ADDR
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-platform-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 20001
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 20001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ai-platform
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 20001
      targetPort: 20001
      nodePort: 30100
