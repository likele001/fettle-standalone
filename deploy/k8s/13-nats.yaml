# ============================================================================
# NATS —— 消息总线（chat-service / 各渠道插件使用）
# ----------------------------------------------------------------------------
# File Storage 模式（-js -sd /data）便于单机持久化。
# 生产如需集群，请改用 NATS Helm chart 或 NATS Operator。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: fettle
  labels:
    app: nats
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: fettle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "--http_port=8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: nats-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: nats-data
          persistentVolumeClaim:
            claimName: nats-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-pvc
  namespace: fettle
  labels:
    app: nats
    app.kubernetes.io/part-of: fettle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: fettle
  labels:
    app: nats
    app.kubernetes.io/part-of: fettle
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
