# ============================================================================
# Redis —— Deployment + Service
# ----------------------------------------------------------------------------
# REDIS_PASSWORD 为空时启动不带 --requirepass。生产环境请务必设置口令，
# 并把下面 args 里的注释打开。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fettle
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: fettle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # 设置了 REDIS_PASSWORD 时，把 secret 挂进来并改成：
          #   args: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\""]
          command: ["redis-server"]
          args:
            - "--appendonly"
            - "yes"
            - "--save"
            - "60"
            - "1"
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fettle-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: fettle
  labels:
    app: redis
    app.kubernetes.io/part-of: fettle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fettle
  labels:
    app: redis
    app.kubernetes.io/part-of: fettle
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
