apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: fettle
  labels:
    app: agent-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
      - name: agent-service
        image: fettle/agent-service:latest
        ports:
        - containerPort: 20016
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: fettle
spec:
  selector:
    app: agent-service
  ports:
  - port: 20016
    targetPort: 20016
  type: ClusterIP
