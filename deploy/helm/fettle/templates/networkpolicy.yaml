{{/*
============================================================================
NetworkPolicy —— 最小化东西向流量
---------------------------------------------------------------------------
需要 CNI 支持（Calico / Cilium / Antrea）。Flannel 下不报错但不生效。
============================================================================
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fettle.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fettle.fullname" . }}-allow-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 同命名空间内互通
    - from:
        - podSelector: {}
    # 放行 ingress-nginx 命名空间（打到 gateway / web-admin 上）
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
{{- end }}
