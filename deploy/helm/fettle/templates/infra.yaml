{{/*
============================================================================
中间件 —— postgres / redis / mongodb / nats / minio
---------------------------------------------------------------------------
单副本 + PVC 的简化部署，适用于测试与小规模生产。
正式生产建议用 operator（CloudNativePG / Redis Operator / MongoDB Operator /
NATS Helm chart）替代本文件的裸 Deployment。
============================================================================
*/}}

{{/* ============================ PostgreSQL ============================ */}}
{{- if .Values.infra.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.infra.postgres.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.postgres.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.infra.postgres.host }}
  template:
    metadata:
      labels:
        app: {{ .Values.infra.postgres.host }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          ports:
            - name: pg
              containerPort: {{ .Values.infra.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.infra.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.infra.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" . }}
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: UTC
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.infra.postgres.user | quote }}, "-d", {{ .Values.infra.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.infra.postgres.user | quote }}, "-d", {{ .Values.infra.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.infra.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.infra.postgres.host }}-pvc
        - name: init
          configMap:
            name: {{ include "fettle.fullname" . }}-pg-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infra.postgres.host }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.infra.postgres.storageClassName }}
  storageClassName: {{ .Values.infra.postgres.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infra.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.postgres.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.postgres.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.infra.postgres.host }}
  ports:
    - name: pg
      port: {{ .Values.infra.postgres.port }}
      targetPort: {{ .Values.infra.postgres.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fettle.fullname" . }}-pg-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    SET TIME ZONE 'UTC';
    CREATE SCHEMA IF NOT EXISTS public;
{{- end }}

{{/* ============================== Redis ============================== */}}
{{- if .Values.infra.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.infra.redis.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.redis.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.infra.redis.host }}
  template:
    metadata:
      labels:
        app: {{ .Values.infra.redis.host }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.infra.redis.image }}
          command: ["redis-server"]
          args:
            {{- if .Values.secrets.redisPassword }}
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            {{- end }}
            - "--appendonly"
            - "yes"
          ports:
            - name: redis
              containerPort: {{ .Values.infra.redis.port }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" . }}
                  key: redis-password
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.infra.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.infra.redis.host }}-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infra.redis.host }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.infra.redis.storageClassName }}
  storageClassName: {{ .Values.infra.redis.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infra.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.redis.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.redis.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.infra.redis.host }}
  ports:
    - name: redis
      port: {{ .Values.infra.redis.port }}
      targetPort: {{ .Values.infra.redis.port }}
{{- end }}

{{/* ============================= MongoDB ============================= */}}
{{- if .Values.infra.mongodb.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.infra.mongodb.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.mongodb.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.infra.mongodb.host }}
  template:
    metadata:
      labels:
        app: {{ .Values.infra.mongodb.host }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: {{ .Values.infra.mongodb.image }}
          ports:
            - name: mongo
              containerPort: {{ .Values.infra.mongodb.port }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: fettle
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.infra.mongodb.database | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" . }}
                  key: mongodb-password
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.infra.mongodb.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.infra.mongodb.host }}-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infra.mongodb.host }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.infra.mongodb.storageClassName }}
  storageClassName: {{ .Values.infra.mongodb.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infra.mongodb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.mongodb.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.mongodb.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.infra.mongodb.host }}
  ports:
    - name: mongo
      port: {{ .Values.infra.mongodb.port }}
      targetPort: {{ .Values.infra.mongodb.port }}
{{- end }}

{{/* =============================== NATS ============================== */}}
{{- if .Values.infra.nats.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.infra.nats.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.nats.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.infra.nats.host }}
  template:
    metadata:
      labels:
        app: {{ .Values.infra.nats.host }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nats
          image: {{ .Values.infra.nats.image }}
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "--http_port=8222"
          ports:
            - name: client
              containerPort: {{ .Values.infra.nats.port }}
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.infra.nats.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.infra.nats.host }}-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infra.nats.host }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.infra.nats.storageClassName }}
  storageClassName: {{ .Values.infra.nats.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infra.nats.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.nats.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.nats.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.infra.nats.host }}
  ports:
    - name: client
      port: {{ .Values.infra.nats.port }}
      targetPort: {{ .Values.infra.nats.port }}
    - name: monitor
      port: 8222
      targetPort: 8222
{{- end }}

{{/* ============================== MinIO ============================== */}}
{{- if .Values.infra.minio.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.infra.minio.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.minio.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.infra.minio.host }}
  template:
    metadata:
      labels:
        app: {{ .Values.infra.minio.host }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.infra.minio.image }}
          args: ["server", "/data", "--console-address", ":{{ .Values.infra.minio.consolePort }}"]
          ports:
            - name: api
              containerPort: {{ .Values.infra.minio.port }}
            - name: console
              containerPort: {{ .Values.infra.minio.consolePort }}
          env:
            # ⚠️ 绝不要用出厂默认 minioadmin/minioadmin。
            #    secrets.yaml 已做弱值硬校验，空值会被 pass 拦截。
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" . }}
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" . }}
                  key: minio-secret-key
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.infra.minio.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.infra.minio.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.infra.minio.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.infra.minio.host }}-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infra.minio.host }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.infra.minio.storageClassName }}
  storageClassName: {{ .Values.infra.minio.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infra.minio.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.minio.host }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.infra.minio.host }}
    {{- include "fettle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.infra.minio.host }}
  ports:
    - name: api
      port: {{ .Values.infra.minio.port }}
      targetPort: {{ .Values.infra.minio.port }}
    - name: console
      port: {{ .Values.infra.minio.consolePort }}
      targetPort: {{ .Values.infra.minio.consolePort }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.infra.minio.host }}-create-bucket
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: {{ .Values.infra.minio.host }}-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local "http://{{ .Values.infra.minio.host }}:{{ .Values.infra.minio.port }}" \
                    "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing "local/{{ .Values.infra.minio.bucket }}"
              echo "bucket {{ .Values.infra.minio.bucket }} ready"
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" . }}
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" . }}
                  key: minio-secret-key
{{- end }}
