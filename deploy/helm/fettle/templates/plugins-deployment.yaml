{{- if .Values.services.plugins.enabled }}
{{- range $name, $plugin := .Values.services.plugins }}
{{- if and $plugin.enabled (ne $name "enabled") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-plugin
  labels:
    app: {{ $name }}-plugin
    {{- include "fettle.labels" $ | nindent 4 }}
spec:
  replicas: {{ $plugin.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}-plugin
  template:
    metadata:
      labels:
        app: {{ $name }}-plugin
    spec:
      containers:
        - name: {{ $name }}-plugin
          image: "{{ $.Values.global.imageRegistry }}/fettle-{{ $name }}-plugin:{{ $.Values.global.imageTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $plugin.port }}
              protocol: TCP
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          env:
            - name: APP_ENV
              value: "production"
            - name: NATS_ADDR
              value: "nats:4222"
            - name: GATEWAY_ADDR
              value: "gateway:{{ $.Values.services.gateway.port }}"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-plugin
spec:
  selector:
    app: {{ $name }}-plugin
  ports:
    - port: {{ $plugin.port }}
      targetPort: {{ $plugin.port }}
      protocol: TCP
{{- end }}
{{- end }}
{{- end }}