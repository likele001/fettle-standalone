{{/*
============================================================================
后端服务 Deployment + Service
---------------------------------------------------------------------------
遍历 .Values.services 里 enabled 的服务（跳过 plugins 子树和 aiEngine
的特殊端口处理，aiEngine 单独渲染）。
每个服务注入：
  - 公共环境变量（fettle.commonEnv）
  - 自身 APP_PORT
  - 安全上下文 / 探针 / 资源
============================================================================
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (ne $name "plugins") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | kebabcase }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name | kebabcase }}
    {{- include "fettle.labels" $ | nindent 4 }}
spec:
  {{- if not $svc.replicas }}
  {{- fail (printf "[FATAL] services.%s.replicas 未设置" $name) }}
  {{- end }}
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name | kebabcase }}
  template:
    metadata:
      labels:
        app: {{ $name | kebabcase }}
        {{- include "fettle.selectorLabels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fettle.serviceAccountName" $ }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name | kebabcase }}
          image: {{ include "fettle.image" (dict
                     "registry" $.Values.global.imageRegistry
                     "repository" $svc.image
                     "tag" $.Values.global.imageTag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: APP_PORT
              value: {{ $svc.port | quote }}
            {{- include "fettle.commonEnv" (dict "root" $) | nindent 12 }}
            {{- if eq $name "agentService" }}
            - name: MINIO_ENDPOINT
              value: {{ printf "%s:%v" $.Values.infra.minio.host $.Values.infra.minio.port | quote }}
            - name: MINIO_BUCKET
              value: {{ $.Values.infra.minio.bucket | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" $ }}
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" $ }}
                  key: minio-secret-key
            {{- end }}
            {{- if eq $name "billingService" }}
            - name: BILLING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" $ }}
                  key: billing-internal-token
            {{- end }}
            {{- if eq $name "chatService" }}
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fettle.secretName" $ }}
                  key: mongodb-password
            {{- end }}
            {{- if eq $name "aiEngine" }}
            - name: APP_HTTP_PORT
              value: {{ $svc.port | quote }}
            - name: APP_GRPC_PORT
              value: {{ $svc.grpcPort | quote }}
            - name: MILVUS_HOST
              value: {{ if $.Values.infra.milvus.enabled }}{{ $.Values.infra.milvus.host | quote }}{{ else }}""{{ end }}
            - name: MILVUS_PORT
              value: {{ $.Values.infra.milvus.port | quote }}
            {{- if $svc.qwenApiKey }}
            - name: QWEN_API_KEY
              value: {{ $svc.qwenApiKey | quote }}
            {{- end }}
            {{- if $svc.deepseekApiKey }}
            - name: DEEPSEEK_API_KEY
              value: {{ $svc.deepseekApiKey | quote }}
            {{- end }}
            {{- if $svc.openaiApiKey }}
            - name: OPENAI_API_KEY
              value: {{ $svc.openaiApiKey | quote }}
            {{- end }}
            {{- end }}
          {{- if $.Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if $.Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | kebabcase }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name | kebabcase }}
    {{- include "fettle.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name | kebabcase }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
    {{- if and (eq $name "aiEngine") $svc.grpcPort }}
    - name: grpc
      port: {{ $svc.grpcPort }}
      targetPort: {{ $svc.grpcPort }}
      protocol: TCP
    {{- end }}
{{- if $.Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name | kebabcase }}-pdb
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name | kebabcase }}
    {{- include "fettle.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ $name | kebabcase }}
{{- end }}
{{- end }}
{{- end }}
