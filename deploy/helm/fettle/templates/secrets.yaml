{{/*
============================================================================
Secret —— 敏感凭据
---------------------------------------------------------------------------
硬校验：__REQUIRED__ 占位符未替换时，helm 渲染直接 fail。
这是有意为之 —— 宁可部署失败，也不要用弱口令静默连库。
============================================================================
*/}}
{{- if not .Values.secrets.externalSecret.enabled }}

{{- $required := list
      (dict "key" "secrets.dbPassword"             "val" .Values.secrets.dbPassword)
      (dict "key" "global.jwtSecret"               "val" .Values.global.jwtSecret)
      (dict "key" "secrets.aiEngineInternalToken"  "val" .Values.secrets.aiEngineInternalToken)
      (dict "key" "secrets.billingInternalToken"   "val" .Values.secrets.billingInternalToken) }}

{{- $missing := "" }}
{{- $weak := "" }}
{{- $weakValues := list "CHANGE_ME" "CHANGE_ME_use_env_var" "change-me" "change-me-in-production" "your-password" "your-jwt-secret-key" "minioadmin" "password" "admin" "123456" "__REQUIRED__" "" }}

{{- range $required }}
  {{- if or (not .val) (eq (toString .val) "__REQUIRED__") }}
    {{- $missing = printf "%s\n        - %s" $missing .key }}
  {{- else if has (toString .val) $weakValues }}
    {{- $weak = printf "%s\n        - %s = %v" $weak .key .val }}
  {{- end }}
{{- end }}

{{- if $missing }}
{{- fail (printf "\n\n[FATAL] 以下必填凭据未设置，拒绝部署：%s\n\n请通过 --set 或独立 values 文件提供，例如：\n  helm install fettle ./fettle -n fettle --create-namespace \\\n    --set global.jwtSecret=\"$(openssl rand -hex 32)\" \\\n    --set secrets.dbPassword=\"$(openssl rand -hex 24)\" \\\n    --set secrets.aiEngineInternalToken=\"$(openssl rand -hex 32)\" \\\n    --set secrets.billingInternalToken=\"$(openssl rand -hex 32)\"\n\n" $missing) }}
{{- end }}

{{- if $weak }}
{{- fail (printf "\n\n[FATAL] 以下凭据仍是占位符/出厂默认值，拒绝部署：%s\n\n请替换为随机值：openssl rand -hex 32\n\n" $weak) }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fettle.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fettle.labels" . | nindent 4 }}
  annotations:
    # 保留 helm 卸载时删除；改用 external-secrets 时本资源整体不渲染
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # ⚠️ 网关读 JWT_SECRET；缺失时 gateway 会 logger.Fatal 退出
  jwt-secret: {{ .Values.global.jwtSecret | quote }}
  # 键名必须与所有 deployment 里的 secretKeyRef.key 一致
  db-password: {{ .Values.secrets.dbPassword | quote }}
  ai-engine-internal-token: {{ .Values.secrets.aiEngineInternalToken | quote }}
  billing-internal-token: {{ .Values.secrets.billingInternalToken | quote }}
  redis-password: {{ .Values.secrets.redisPassword | default "" | quote }}
  mongodb-password: {{ .Values.secrets.mongodbPassword | default "" | quote }}
  nats-password: {{ .Values.secrets.natsPassword | default "" | quote }}
  channel-secret: {{ .Values.secrets.channelSecret | default "" | quote }}
  minio-access-key: {{ .Values.secrets.minioAccessKey | default "" | quote }}
  minio-secret-key: {{ .Values.secrets.minioSecretKey | default "" | quote }}

{{- end }}
