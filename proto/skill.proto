syntax = "proto3";

package skill;

option go_package = "backend/skill-service/proto";

service SkillService {
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  rpc CreateSkill(CreateSkillRequest) returns (CreateSkillResponse);
  rpc UpdateSkill(UpdateSkillRequest) returns (UpdateSkillResponse);
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc ExecuteSkill(ExecuteSkillRequest) returns (ExecuteSkillResponse);
}

message Skill {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string type = 5;
  string config = 6;
  string status = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message GetSkillRequest {
  string id = 1;
}

message GetSkillResponse {
  Skill skill = 1;
}

message CreateSkillRequest {
  string tenant_id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string config = 5;
}

message CreateSkillResponse {
  Skill skill = 1;
}

message UpdateSkillRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string config = 5;
  string status = 6;
}

message UpdateSkillResponse {
  Skill skill = 1;
}

message DeleteSkillRequest {
  string id = 1;
}

message DeleteSkillResponse {
  bool success = 1;
}

message ListSkillsRequest {
  string tenant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string type = 4;
  string status = 5;
}

message ListSkillsResponse {
  repeated Skill skills = 1;
  int32 total = 2;
}

message ExecuteSkillRequest {
  string skill_id = 1;
  string input = 2;
}

message ExecuteSkillResponse {
  string output = 1;
  bool success = 2;
}
