syntax = "proto3";

package billing;

option go_package = "backend/billing-service/proto";

service BillingService {
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc SubscribePlan(SubscribePlanRequest) returns (SubscribePlanResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
}

message Plan {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string period = 5;
  int32 agent_limit = 6;
  int32 message_limit = 7;
  int32 knowledge_base_limit = 8;
  string status = 9;
  int64 created_at = 10;
}

message Subscription {
  string id = 1;
  string tenant_id = 2;
  string plan_id = 3;
  string status = 4;
  int64 start_date = 5;
  int64 end_date = 6;
  int64 created_at = 7;
}

message Payment {
  string id = 1;
  string tenant_id = 2;
  string subscription_id = 3;
  double amount = 4;
  string payment_method = 5;
  string status = 6;
  int64 paid_at = 7;
  int64 created_at = 8;
}

message GetPlanRequest {
  string id = 1;
}

message GetPlanResponse {
  Plan plan = 1;
}

message ListPlansRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPlansResponse {
  repeated Plan plans = 1;
  int32 total = 2;
}

message SubscribePlanRequest {
  string tenant_id = 1;
  string plan_id = 2;
  string payment_method = 3;
}

message SubscribePlanResponse {
  Subscription subscription = 1;
  Payment payment = 2;
}

message GetSubscriptionRequest {
  string tenant_id = 1;
}

message GetSubscriptionResponse {
  Subscription subscription = 1;
}

message CreatePaymentRequest {
  string tenant_id = 1;
  string subscription_id = 2;
  double amount = 3;
  string payment_method = 4;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message ListPaymentsRequest {
  string tenant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32 total = 2;
}
