app:
  name: "gateway"
  port: 9100
  env: "development"
  log_level: "info"
  # 必须通过 JWT_SECRET 环境变量设置，否则服务无法启动
  jwt_secret: ""

services:
  user_service: "http://localhost:9200"
  agent_service: "http://localhost:9300"
  chat_service: "http://localhost:9400"
  skill_service: "http://localhost:9500"
  billing_service: "http://localhost:9600"
  ai_engine: "http://localhost:9700"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

rate_limit:
  public:
    max_requests: 100
    window: "1m"
  authenticated:
    max_requests: 1000
    window: "1m"
