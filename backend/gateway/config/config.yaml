app:
  name: "gateway"
  port: 20001
  env: "development"
  log_level: "info"
  # 必须通过 JWT_SECRET 环境变量设置，否则服务无法启动
  jwt_secret: ""

services:
  user_service: "http://localhost:20002"
  agent_service: "http://localhost:20003"
  chat_service: "http://localhost:20004"
  skill_service: "http://localhost:20005"
  billing_service: "http://localhost:20006"
  ai_engine: "http://localhost:20007"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

rate_limit:
  public:
    max_requests: 100
    window: "1m"
  authenticated:
    max_requests: 1000
    window: "1m"
