syntax = "proto3";

package ai_engine;

option go_package = "ai-platform/chat-service/proto/ai_engine";

service AIEngine {
    rpc RecognizeIntent(IntentRequest) returns (IntentResponse);
    rpc PlanTask(PlanRequest) returns (PlanResponse);
    rpc GenerateReply(ReplyRequest) returns (ReplyResponse);
    rpc StreamReply(StreamRequest) returns (stream StreamResponse);
    rpc GenerateEmbedding(EmbeddingRequest) returns (EmbeddingResponse);
    rpc RetrieveKnowledge(KnowledgeRequest) returns (KnowledgeResponse);
}

message IntentRequest {
    string tenant_id = 1;
    string user_id = 2;
    string input = 3;
    string agent_id = 4;
    map<string, string> context = 5;
}

message IntentResponse {
    string intent = 1;
    float confidence = 2;
    map<string, string> entities = 3;
    string raw_response = 4;
}

message PlanRequest {
    string tenant_id = 1;
    string user_id = 2;
    string goal = 3;
    string agent_id = 4;
    repeated string available_tools = 5;
    map<string, string> context = 6;
}

message PlanResponse {
    repeated TaskStep steps = 1;
    string reasoning = 2;
}

message TaskStep {
    string step_id = 1;
    string action = 2;
    string tool = 3;
    map<string, string> parameters = 4;
    string description = 5;
}

message ReplyRequest {
    string tenant_id = 1;
    string user_id = 2;
    string input = 3;
    string agent_id = 4;
    string conversation_id = 5;
    repeated Message history = 6;
    map<string, string> context = 7;
    string model = 8;
}

message Message {
    string role = 1;
    string content = 2;
    int64 timestamp = 3;
}

message ReplyResponse {
    string reply = 1;
    string model_used = 2;
    int32 tokens_used = 3;
    float latency_ms = 4;
}

message StreamRequest {
    string tenant_id = 1;
    string user_id = 2;
    string input = 3;
    string agent_id = 4;
    string conversation_id = 5;
    repeated Message history = 6;
    map<string, string> context = 7;
    string model = 8;
}

message StreamResponse {
    string chunk = 1;
    bool is_final = 2;
    string model_used = 3;
    int32 tokens_used = 4;
}

message EmbeddingRequest {
    repeated string texts = 1;
    string model = 2;
}

message EmbeddingResponse {
    repeated EmbeddingVector embeddings = 1;
    string model_used = 2;
    int32 tokens_used = 3;
}

message EmbeddingVector {
    repeated float values = 1;
    int32 dimension = 2;
}

message KnowledgeRequest {
    string tenant_id = 1;
    string query = 2;
    string knowledge_base_id = 3;
    int32 top_k = 4;
    float score_threshold = 5;
}

message KnowledgeResponse {
    repeated KnowledgeChunk chunks = 1;
    int32 total_found = 2;
}

message KnowledgeChunk {
    string content = 1;
    float score = 2;
    map<string, string> metadata = 3;
    string document_id = 4;
}
